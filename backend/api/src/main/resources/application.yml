server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: classroom-api

  datasource:
    url: jdbc:postgresql://localhost:5432/classroom_db
    username: classroom_user
    password: classroom_secret_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7

logging:
  level:
    root: INFO
    com.classroom.platform: DEBUG
    org.springframework.security: INFO
